services:
  ytmp3web:
    build: .
    container_name: ytmp3web
    ports:
      - "8085:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - DOWNLOAD_DIR=/app/downloads
      - LOGS_DIR=/app/logs
    restart: unless-stopped